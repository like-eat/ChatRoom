[mainConfig]
appName = "KamaChat"
host = "127.0.0.1"
port = 8000

[mysqlConfig]
host = "127.0.0.1"
port = 13306
user = "root"
password = "kama_chat"
databaseName = "kama_chat"

[redisConfig]
host = "127.0.0.1"
port = 16379
password = ""
db = 0

[authCodeConfig]
accessKeyID = "your accessKeyID in alibaba cloud"
accessKeySecret = "your accessKeySecret in alibaba cloud"
signName = "阿里云短信测试"
templateCode = "SMS_154950909"
devMode = true
devCode = "123456"

[jwtConfig]
# 仅用于本地开发。生产环境必须通过 KAMA_CHAT_JWT_SECRET 设置高熵随机密钥。
secret = "kama-chat-local-dev-secret-change-before-production-2026"
issuer = "kama-chat"
audience = "kama-chat-web"
expireHours = 24

[logConfig]
logPath = "./logs/kama-chat.log"

[kafkaConfig]
messageMode = "channel" # 消息模式 channel or kafka
hostPort = "127.0.0.1:9092" # "127.0.0.1:9092,127.0.0.1:9093,127.0.0.1:9094" 多个kafka服务器
loginTopic = "login"
chatTopic = "chat_message"
logoutTopic = "logout"
partition = 0 # kafka partition
timeout = 1 # 单位秒

[staticSrcConfig]
staticAvatarPath = "./static/avatars"
staticFilePath = "./static/files"
